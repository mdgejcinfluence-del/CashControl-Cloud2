name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5-dev libncursesw5-dev zlib1g-dev build-essential libssl-dev libffi-dev openjdk-17-jdk ant autoconf automake libtool patch
          pip install --upgrade pip
          pip install buildozer cython kivy cryptography requests

      - name: Force Accept Android Licenses
        run: |
          # Installation manuelle des licences pour éviter le Broken Pipe
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          # Cette commande accepte toutes les licences SDK avant de lancer Buildozer
          yes | sdkmanager --licenses || true

      - name: Build APK (Manual License Mode)
        run: |
          # On définit les chemins pour aider Buildozer à trouver le SDK
          export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
          export ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r25b
          # On lance la compilation sans le 'yes |' au début pour voir l'erreur réelle
          buildozer -v android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashControl-Final-APK
          path: bin/*.apk
