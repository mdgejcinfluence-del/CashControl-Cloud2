name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          # Libère de la place pour la compilation de cryptography
          sudo docker image prune -a -f
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5-dev libncursesw5-dev zlib1g-dev build-essential \
          libssl-dev libffi-dev openjdk-17-jdk ant autoconf automake libtool patch
          pip install --upgrade pip
          pip install buildozer cython kivy cryptography requests

      - name: Force Accept Android Licenses (Manual Signature)
        run: |
          # Création forcée du répertoire de licences attendu par Buildozer
          mkdir -p .buildozer/android/platform/android-sdk/licenses
          
          # Injection des empreintes (hashes) de licences officielles Google
          # Cela simule l'acceptation manuelle pour toutes les versions (y)
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743402295594811d12\n24333f8a63b6825ea9d5573f8e9976d4e3b2365b" > .buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > .buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          
          # Création du fichier config système pour éviter les questions résiduelles
          mkdir -p ~/.android && touch ~/.android/repositories.cfg

      - name: Build APK (Bypass Aidl Error)
        run: |
          # Isolation du build : on ignore les SDK pré-installés conflictuels
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          # On lance la compilation propre pour CashControl
          buildozer -v android debug
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashControl-Final-APK
          path: bin/*.apk
