name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5-dev libncursesw5-dev zlib1g-dev build-essential \
          libssl-dev libffi-dev openjdk-17-jdk ant autoconf automake libtool patch
          pip install --upgrade pip
          pip install buildozer cython kivy cryptography requests

      - name: Force Fix Licenses
        run: |
          # On crée le dossier qui bloque tout
          mkdir -p .buildozer/android/platform/android-sdk/licenses
          # On injecte les signatures pour que le message "Accept? (y/N)" disparaisse
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743402295594811d12\n24333f8a63b6825ea9d5573f8e9976d4e3b2365b" > .buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build APK (API 31 Stability)
        run: |
          # On force la version 31 pour éviter les bugs de la version 37
          export APP_ANDROID_API=31
          export APP_ANDROID_BUILD_TOOLS_VERSION=31.0.0
          unset ANDROID_HOME
          buildozer -v android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashControl-Final-APK
          path: bin/*.apk
