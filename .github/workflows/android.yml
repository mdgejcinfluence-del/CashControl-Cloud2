name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5-dev libncursesw5-dev zlib1g-dev build-essential libssl-dev libffi-dev openjdk-17-jdk ant autoconf automake libtool
          pip install --upgrade pip
          pip install buildozer cython kivy cryptography requests

      - name: Pre-install Android Platform Tools
        run: |
          # Création forcée des répertoires pour éviter le Broken Pipe
          mkdir -p .buildozer/android/platform/
          # Clonage direct de python-for-android dans le dossier attendu
          git clone --depth 1 https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android

      - name: Build APK
        run: |
          # On lance le build sans faire de clean pour garder le dossier cloné
          # On augmente le niveau de log à 2 pour voir précisément où ça bloque si besoin
          yes | buildozer -v android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashControl-Final-APK
          path: bin/*.apk
