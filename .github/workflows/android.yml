name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Radical Disk Cleanup
        run: |
          # On supprime les SDK Android pré-installés par GitHub qui causent le conflit de licence
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune -a -f

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5-dev libncursesw5-dev zlib1g-dev build-essential \
          libssl-dev libffi-dev openjdk-17-jdk ant autoconf automake libtool patch
          pip install --upgrade pip
          pip install buildozer cython kivy cryptography requests

      - name: Pre-Authorize Licenses (The "Silent" Method)
        run: |
          # On crée le dossier de licences directement dans le répertoire de travail de Buildozer
          mkdir -p .buildozer/android/platform/android-sdk/licenses
          
          # On injecte les signatures officielles de Google pour dire "OUI" à tout
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743402295594811d12\n24333f8a63b6825ea9d5573f8e9976d4e3b2365b" > .buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > .buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          
          # On s'assure que le système global est aussi au courant
          mkdir -p ~/.android && touch ~/.android/repositories.cfg

      - name: Build APK (Bypass Aidl Error)
        run: |
          # On force Buildozer à ignorer les chemins système pour éviter la version 37
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          
          # On lance la compilation en mode verbeux pour voir le succès
          buildozer -v android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashControl-Final-APK
          path: bin/*.apk
