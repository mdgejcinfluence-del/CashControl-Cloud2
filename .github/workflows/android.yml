name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5-dev libncursesw5-dev zlib1g-dev build-essential libssl-dev libffi-dev openjdk-17-jdk ant autoconf automake libtool patch
          pip install --upgrade pip
          pip install buildozer cython kivy cryptography requests

      - name: Pre-Accept Android Licenses
        run: |
          # Création forcée des fichiers de licence pour éviter que Buildozer ne pose de questions
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          mkdir -p .buildozer/android/platform/android-sdk/licenses
          # Écriture des hash de licences standards
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743402295594811d12\n24333f8a63b6825ea9d5573f8e9976d4e3b2365b" > .buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > .buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build APK (Bypass Broken Pipe)
        run: |
          # On définit des limites de ressources pour stabiliser le build
          export APP_ANDROID_ARCHS="arm64-v8a"
          # On lance buildozer sans le pipe 'yes' pour éviter le crash du flux
          buildozer -v android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashControl-Final-APK
          path: bin/*.apk
