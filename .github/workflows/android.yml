name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo docker image prune -a -f
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5-dev libncursesw5-dev zlib1g-dev build-essential \
          libssl-dev libffi-dev openjdk-17-jdk ant autoconf automake libtool patch
          pip install --upgrade pip
          pip install buildozer cython kivy cryptography requests

      - name: Force Accept Android Licenses (Manual Signature)
        run: |
          # On crée les dossiers de licences là où Buildozer va les chercher
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          mkdir -p .buildozer/android/platform/android-sdk/licenses
          
          # Injection des signatures de licences officielles Google
          # Cela simule l'acceptation (y) pour empêcher le blocage
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743402295594811d12\n24333f8a63b6825ea9d5573f8e9976d4e3b2365b" > .buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > .buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          
          # On accepte aussi via le SDK Manager système pour doubler la sécurité
          yes | sdkmanager --licenses || true

      - name: Build APK (Bypass Version 37)
        run: |
          # ON FORCE Buildozer à ignorer les SDK pré-installés conflictuels
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          
          # On impose l'API 31 et les build-tools stables pour éviter l'erreur Aidl
          export APP_ANDROID_API=31
          export APP_ANDROID_BUILD_TOOLS_VERSION=31.0.0
          
          # On lance le build final
          buildozer -v android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashControl-Final-APK
          path: bin/*.apk
