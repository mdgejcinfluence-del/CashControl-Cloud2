name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5-dev libncursesw5-dev zlib1g-dev build-essential \
          libssl-dev libffi-dev openjdk-17-jdk ant autoconf automake libtool patch
          pip install --upgrade pip
          pip install buildozer cython kivy cryptography requests

      - name: Fix Android SDK & Licenses
        run: |
          # On crée les répertoires de licences pour Buildozer
          mkdir -p .buildozer/android/platform/android-sdk/licenses
          
          # Injection des empreintes de licences pour éviter le (y/N)
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743402295594811d12\n24333f8a63b6825ea9d5573f8e9976d4e3b2365b" > .buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # On utilise le sdkmanager du système pour installer les build-tools proprement
          # sans passer par un lien URL risqué
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;31.0.0" "platforms;android-31"

      - name: Build APK (Bypass Error)
        run: |
          # On force Buildozer à utiliser ce que nous venons de préparer
          export APP_ANDROID_API=31
          # On lance le build final pour CashControl
          buildozer -v android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashControl-Final-APK
          path: bin/*.apk
